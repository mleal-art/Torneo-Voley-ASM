<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c3aa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voley ASM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Torneo mixto Voley · ASM</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--u:min(1vw,1.7778vh);--az:#355dd6;--az2:#1c3aa8;--lima:#c8ff00;--oscuro:#10246e;--card:rgba(255,255,255,.1);--borde:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Poppins,'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#4b74e6 0%,var(--az) 55%,var(--az2) 100%) fixed;background-color:var(--az);min-height:100vh;padding-bottom:84px;font-weight:500}
h1,h2,h3,.disp{font-weight:800;margin:0;letter-spacing:-.5px}
button{font:inherit;cursor:pointer;border:0}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.logo{height:40px;width:auto;display:block;flex:none}
header h1{font-size:20px;line-height:20px;min-height:40px;display:flex;flex-direction:column;justify-content:center;text-transform:uppercase;text-wrap:balance;letter-spacing:.2px;flex:1}
header h1 small{display:none}
header small{display:block;font-weight:600;font-size:12px;opacity:.8;margin-top:3px}
.gear{background:var(--card);color:#fff;border:1px solid var(--borde);border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px}
main{padding:6px 14px 20px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--oscuro);box-shadow:0 -6px 20px rgba(0,0,0,.25)}
nav button{flex:1;padding:11px 4px;border-radius:999px;background:transparent;color:#fff;font-weight:800;font-size:13px}
nav button.on{background:var(--lima);color:var(--oscuro)}
.card{background:var(--card);border:1px solid var(--borde);border-radius:20px;padding:14px;margin:0 0 12px}
.sec{font-size:15px;margin:18px 2px 8px}
.btn{background:var(--lima);color:var(--oscuro);border-radius:999px;padding:12px 18px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.22);display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn.sm{padding:8px 13px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid var(--borde);box-shadow:none}
.btn.red{background:#ff6b6b;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tr{display:flex;align-items:center;gap:10px;padding:5px 0}
.tn{flex:1;font-weight:900;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.sw{font-weight:800;font-size:30px;min-width:34px;text-align:right}
.cp{font-weight:800;font-size:30px;background:var(--lima);color:var(--oscuro);border-radius:12px;min-width:58px;text-align:center;padding:2px 8px}
.meta{font-size:12px;font-weight:700;opacity:.8;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips i{font-style:normal;font-weight:800;font-size:13px;background:rgba(0,0,0,.22);border-radius:8px;padding:3px 9px}
.vivo{display:inline-flex;align-items:center;gap:7px;background:var(--lima);color:var(--oscuro);font-weight:900;font-size:12px;border-radius:999px;padding:4px 11px}
.vivo:before{content:"";width:9px;height:9px;border-radius:50%;background:#e11d48;animation:p 1.1s infinite}
@keyframes p{50%{opacity:.25}}
.crono{display:inline-block;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 10px;letter-spacing:.2px;opacity:1}
.big .crono{font-size:15px}
.crono.fija{background:rgba(0,0,0,.18);font-weight:700}
.big .tn{font-size:22px}.big .sw,.big .cp{font-size:40px}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pts>div{background:rgba(0,0,0,.2);border-radius:16px;padding:10px;text-align:center}
.pts b{display:block;font-size:13px;margin-bottom:8px;overflow-wrap:anywhere}
.pts .btn{width:100%;font-size:26px;padding:12px 0}
.pts .m{margin-top:8px;background:transparent;color:#fff;border:1.5px solid var(--borde);box-shadow:none;font-size:16px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-align:center;opacity:.75;padding:4px 3px}
td{padding:9px 3px;text-align:center;border-top:1px solid var(--borde);font-weight:700}
td:nth-child(2),th:nth-child(2){text-align:left;font-weight:900;width:100%}
td:last-child{font-weight:800;color:var(--lima);font-size:17px}
.pos{opacity:.7;width:22px}
.vacio{text-align:center;padding:26px 10px;opacity:.85;font-weight:700}
.banner{background:var(--lima);color:var(--oscuro);font-weight:800;font-size:13px;border-radius:14px;padding:10px 12px;margin-bottom:12px}
#modal{position:fixed;inset:0;background:rgba(8,16,60,.75);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--az2);border:1px solid var(--borde);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}
input,select{width:100%;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1.5px solid var(--borde);background:#fff;color:var(--oscuro)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--oscuro);color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;display:none;z-index:30;max-width:90%;text-align:center}
.st{font-size:11px;font-weight:800;opacity:.85}
/* TV */
body.tv{padding:0;overflow:hidden;height:100vh}
body.tv main{max-width:none;margin:0;padding:0}
body.tv header,body.tv nav{display:none}
.tvw{display:grid;grid-template-columns:1.35fr 1fr;gap:calc(2*var(--u));padding:calc(2.2*var(--u));height:100vh}
.tvw h2{font-size:calc(2.2*var(--u));margin-bottom:calc(1*var(--u))}
.tvw .card{border-radius:calc(1.6*var(--u));padding:calc(1.6*var(--u));margin-bottom:calc(1.4*var(--u))}
.tvw .tn{font-size:calc(3.2*var(--u))}.tvw .sw{font-size:calc(4.6*var(--u))}.tvw .cp{font-size:calc(4.6*var(--u));min-width:calc(9*var(--u));border-radius:calc(1.4*var(--u))}
.tvw .meta{font-size:calc(1.4*var(--u));gap:calc(1*var(--u))}.tvw .crono{font-size:calc(2.2*var(--u));padding:calc(.2*var(--u)) calc(1.2*var(--u));margin-left:0}.tvw .chips i{font-size:calc(1.5*var(--u))}.tvw .vivo{font-size:calc(1.3*var(--u))}
.tvw table{font-size:calc(1.5*var(--u))}.tvw th{font-size:calc(1.1*var(--u))}.tvw td:last-child{font-size:calc(1.8*var(--u))}
.tvw .side .tn{font-size:calc(2.3*var(--u))}.tvw .side .card{padding:calc(1.2*var(--u))}
.tvt{display:flex;align-items:center;gap:calc(1.2*var(--u));margin-bottom:calc(1.2*var(--u))}.tvt .logo{height:calc(7*var(--u))}.tvt h1{font-size:calc(3*var(--u));text-transform:uppercase;line-height:1.05}
.cred{text-align:center;font-size:11px;font-weight:600;opacity:.6;margin:20px 0 4px;letter-spacing:.2px}
.tvcred{position:fixed;right:calc(2.2*var(--u));bottom:calc(.9*var(--u));font-size:calc(1.05*var(--u));margin:0;opacity:.55}
/* TV vertical (por si se abre en un celu): una sola columna con scroll */
@media (orientation:portrait){body.tv{overflow:auto;height:auto}.tvw{grid-template-columns:1fr;height:auto}.tvcred{position:static;text-align:center;font-size:11px;padding-bottom:16px}}
.tvw .tr{padding:calc(.3*var(--u)) 0;gap:calc(1*var(--u))}.tvw .chips{margin-top:calc(.5*var(--u));gap:calc(.5*var(--u))}.tvw .chips i{padding:calc(.2*var(--u)) calc(.7*var(--u));border-radius:calc(.6*var(--u))}
.tvw td{padding:calc(.7*var(--u)) calc(.25*var(--u))}.tvw th{padding:calc(.3*var(--u)) calc(.25*var(--u))}.tvw .meta{margin-bottom:calc(.4*var(--u))}
.tvw .vivo{padding:calc(.3*var(--u)) calc(.9*var(--u));gap:calc(.6*var(--u))}
/* hero */
.hero{display:flex;justify-content:center;padding:6px 0 18px}.hero img{height:110px;width:auto}
@media (prefers-reduced-motion:reduce){.vivo:before{animation:none}}
</style>
</head>

  <h1><span id="ttl">Torneo mixto Voley</span><small id="sub"></small></h1>
  <button class="gear" id="gear" onclick="gearClick()">Organizador</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="vivo" onclick="go('vivo')">En vivo</button>
  <button data-t="tabla" onclick="go('tabla')">Tabla</button>
  <button data-t="partidos" onclick="go('partidos')">Partidos</button>
  <button data-t="equipos" onclick="go('equipos')">Equipos</button>
</nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
/* ============ CONFIG ============
   Pegá acá la config de tu proyecto Firebase (Configuración del proyecto > Tus apps > Web).
   Mientras sea null, la app funciona en MODO PRUEBA (datos solo en este celu). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAdUINynFlTTkjTmffikqbpwBTh3LycVjQ",
  authDomain: "torneo-voley-asm.firebaseapp.com",
  projectId: "torneo-voley-asm",
  storageBucket: "torneo-voley-asm.firebasestorage.app",
  messagingSenderId: "125668778727",
  appId: "1:125668778727:web:bf7e4f4c7fbec0b3217842"
};
/* ================================ */

const DEF={cfg:{nombre:'Torneo mixto Voley',pV:3,pD:0},equipos:[],partidos:[]};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEF),A=false,tab='vivo',fs=null,auth=null;
const TV=new URLSearchParams(location.search).get('modo')==='tv';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60,mm=String(m).padStart(2,'0'),ss=String(s).padStart(2,'0');return h?h+':'+mm+':'+ss:mm+':'+ss};
const cronoHTML=p=>p.estado==='vivo'&&p.inicio?`<span class="crono" data-i="${+p.inicio}">Tiempo ${fmt(Date.now()-p.inicio)}</span>`:(p.estado==='fin'&&p.dur?`<span class="crono fija">Duración ${fmt(p.dur)}</span>`:'');
setInterval(()=>document.querySelectorAll('.crono[data-i]').forEach(e=>{e.textContent='Tiempo '+fmt(Date.now()-(+e.dataset.i))}),1000);
const tn=id=>(S.equipos.find(e=>e.id===id)||{nombre:'¿?'}).nombre;
const toast=t=>{const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2600)};

function init(){
  if(FIREBASE_CONFIG){
    firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore();auth=firebase.auth();
    fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    auth.onAuthStateChanged(u=>{A=!!u&&!TV;render()});
    fs.doc('torneo/estado').onSnapshot(d=>{
      S=d.exists?Object.assign(clone(DEF),d.data()):clone(DEF);
      if(!S.partidos)S.partidos=[];if(!S.equipos)S.equipos=[];
      render();
    },e=>toast('Sin conexión con la base'));
  }else{
    try{const t=localStorage.getItem('asm_voley');if(t)S=Object.assign(clone(DEF),JSON.parse(t))}catch(e){}
    A=!TV;render();
  }
  if(TV){const w=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};w();document.addEventListener('click',w);document.addEventListener('visibilitychange',w)}
}
function save(){
  if(fs){fs.doc('torneo/estado').set(clone(S)).catch(e=>toast('No se pudo guardar: '+e.message))}
  else{try{localStorage.setItem('asm_voley',JSON.stringify(S))}catch(e){}}
  render();
}

/* ---------- cálculos ---------- */
function sw(p){return[p.sets.filter(s=>s.a>s.b).length,p.sets.filter(s=>s.b>s.a).length]}
function tabla(){
  const m={};
  S.equipos.forEach(e=>m[e.id]={e,pj:0,pg:0,pp:0,sf:0,sc:0,pf:0,pc:0,pts:0});
  S.partidos.filter(p=>p.estado==='fin'&&m[p.a]&&m[p.b]).forEach(p=>{
    const[sa,sb]=sw(p);let pa=0,pb=0;p.sets.forEach(s=>{pa+=s.a;pb+=s.b});
    const X=m[p.a],Y=m[p.b];X.pj++;Y.pj++;X.sf+=sa;X.sc+=sb;Y.sf+=sb;Y.sc+=sa;X.pf+=pa;X.pc+=pb;Y.pf+=pb;Y.pc+=pa;
    const aw=sa>sb||(sa===sb&&pa>pb);const W=aw?X:Y,L=aw?Y:X;
    W.pg++;L.pp++;
    if((S.cfg.modo||'voley')==='voley'){const mx=Math.max(sa,sb),mn=Math.min(sa,sb);const ajustado=(mx-mn===1&&sa+sb>=3);W.pts+=ajustado?2:3;L.pts+=ajustado?1:0}
    else{W.pts+=+S.cfg.pV;L.pts+=+S.cfg.pD}
  });
  const gs=[...new Set(S.equipos.map(e=>e.g||''))];
  return gs.map(g=>({g,rows:Object.values(m).filter(r=>(r.e.g||'')===g).sort((a,b)=>b.pts-a.pts||(b.sf-b.sc)-(a.sf-a.sc)||(b.pf-b.pc)-(a.pf-a.pc)||a.e.nombre.localeCompare(b.e.nombre))}));
}
function tablaHTML(){
  const T=tabla();if(!S.equipos.length)return'<div class="vacio">Todavía no hay equipos cargados.</div>';
  return T.map(t=>`<div class="card">${t.g?`<h3 style="font-size:16px;margin-bottom:6px">${esc(t.g)}</h3>`:''}<table><tr><th></th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>Sets</th><th>Pts</th></tr>${t.rows.map((r,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(r.e.nombre)}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td>${r.sf-r.sc>0?'+':''}${r.sf-r.sc}</td><td>${r.pts}</td></tr>`).join('')}</table></div>`).join('');
}

/* ---------- tarjetas de partido ---------- */
function mcard(p,big){
  const[a,b]=sw(p),L=p.estado==='vivo',P=p.estado==='pendiente',c=p.cur||{a:0,b:0};
  const row=(n,w,pt)=>`<div class="tr"><span class="tn">${esc(n)}</span>${L?`<span class="cp">${pt}</span>`:''}${P?'':`<span class="sw">${w}</span>`}</div>`;
  const meta=[p.fase,p.cancha].filter(Boolean).map(esc).join(' · ');
  return`<div class="card ${big?'big':''}">
    <div class="meta">${L?'<span class="vivo">EN VIVO</span> ':''}${cronoHTML(p)}${P?'Pendiente'+(meta?' · ':''):''}${meta}</div>
    ${row(tn(p.a),a,c.a)}${row(tn(p.b),b,c.b)}
    ${p.sets.length?`<div class="chips">${p.sets.map(s=>`<i>${s.a}-${s.b}</i>`).join('')}</div>`:''}
    ${A?ctl(p):''}</div>`;
}
function ctl(p){
  const I=p.id;
  if(p.estado==='vivo')return`<div class="pts">
    <div><b>${esc(tn(p.a))}</b><button class="btn" onclick="pt('${I}','a',1)">+1</button><button class="btn m" onclick="pt('${I}','a',-1)">−1</button></div>
    <div><b>${esc(tn(p.b))}</b><button class="btn" onclick="pt('${I}','b',1)">+1</button><button class="btn m" onclick="pt('${I}','b',-1)">−1</button></div></div>
    <div class="row" style="margin-top:12px"><button class="btn sm" onclick="cerrarSet('${I}')">Cerrar set</button><button class="btn sm" onclick="finalizar('${I}')">Finalizar partido</button><button class="btn sm ghost" onclick="editM('${I}')">Editar</button><button class="btn sm ghost" onclick="reiniciarReloj('${I}')">Reiniciar reloj</button></div>`;
  if(p.estado==='pendiente')return`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="iniciar('${I}')">Iniciar partido</button><button class="btn sm ghost" onclick="subir('${I}')">Subir en la cola</button><button class="btn sm ghost" onclick="editM('${I}')">Editar</button></div>`;
  return`<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="editM('${I}')">Editar sets</button><button class="btn sm ghost" onclick="reabrir('${I}')">Reabrir</button></div>`;
}

/* ---------- vistas ---------- */
function vVivo(){
  const L=S.partidos.filter(p=>p.estado==='vivo'),N=S.partidos.filter(p=>p.estado==='pendiente'),F=S.partidos.filter(p=>p.estado==='fin').slice(-3).reverse();
  let h=`<div class="hero"><img alt="ASM" src="${document.querySelector('#hd img').src}"></div>`;
  h+=L.length?L.map(p=>mcard(p,true)).join(''):`<div class="card vacio">No hay ningún partido en juego ahora.${A?'<br><br>Elegí uno de la cola y tocá “Iniciar partido”.':''}</div>`;
  if(N.length){h+=`<h2 class="sec">Próximo partido</h2>`+mcard(N[0]);if(N.length>1)h+=`<h2 class="sec">Más adelante</h2>`+N.slice(1,3).map(p=>mcard(p)).join('')}
  if(F.length){h+=`<h2 class="sec">Últimos resultados</h2>`+F.map(p=>mcard(p)).join('')}
  return h;
}
function vPartidos(){
  let h='';
  if(A)h+=`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="editM()">+ Partido</button><button class="btn ghost" onclick="todosContraTodos()">Armar todos contra todos</button></div>`;
  const grupos=[['En juego','vivo'],['Pendientes','pendiente'],['Terminados','fin']];
  grupos.forEach(([t,e])=>{const l=S.partidos.filter(p=>p.estado===e);if(l.length)h+=`<h2 class="sec">${t}</h2>`+l.map(p=>mcard(p)).join('')});
  if(!S.partidos.length)h+='<div class="vacio">Todavía no hay partidos cargados.</div>';
  return h;
}
function vEquipos(){
  let h=A?`<div style="margin-bottom:12px"><button class="btn" onclick="editE()">+ Agregar equipo</button></div>`:'';
  if(!S.equipos.length)return h+'<div class="vacio">Todavía no hay equipos cargados.</div>';
  return h+S.equipos.map(e=>`<div class="card"><div class="tr"><span class="tn">${esc(e.nombre)}</span>${A?`<button class="btn sm ghost" onclick="editE('${e.id}')">Editar</button>`:''}</div><div class="meta">${[e.g,e.cap&&'Cap: '+e.cap,e.jug&&e.jug+' jugadores'].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('');
}
function vTV(){
  const L=S.partidos.filter(p=>p.estado==='vivo'),N=S.partidos.filter(p=>p.estado==='pendiente').slice(0,3);
  return`<div class="tvw"><div><div class="tvt"><img class="logo" alt="ASM" src="${document.querySelector('#hd img').src}"><h1>${esc(S.cfg.nombre)}</h1></div>
    ${L.length?L.map(p=>mcard(p,true)).join(''):'<div class="card vacio" style="font-size:calc(2.4*var(--u))">Entre partido y partido…</div>'}
    ${N.length?`<h2 class="disp">Próximo partido</h2><div class="side">${mcard(N[0])}</div>`:''}</div>
    <div><h2 class="disp">Posiciones</h2>${tablaHTML()}</div><div class="cred tvcred">Desarrollado por Matías Leal</div></div>`;
}

function render(){
  document.body.classList.toggle('tv',TV);
  $('ttl').textContent=S.cfg.nombre;
  $('gear').textContent=A?'Ajustes':'Organizador';
  $('gear').style.display=TV?'none':'';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(TV){$('main').innerHTML=vTV();return}
  let h='';
  if(!fs&&A)h+='<div class="banner">Modo prueba: lo que cargues queda solo en este celu. Para sincronizar con los demás, falta pegar la config de Firebase en el archivo.</div>';
  h+={vivo:vVivo,tabla:()=>tablaHTML(),partidos:vPartidos,equipos:vEquipos}[tab]();
  h+='<div class="cred">Desarrollado por Matías Leal</div>';
  $('main').innerHTML=h;
}
function go(t){tab=t;render();scrollTo(0,0)}

/* ---------- modal ---------- */
function openModal(h){$('mbox').innerHTML=h;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
const val=id=>$(id).value.trim();

function gearClick(){
  if(!A){return openModal(`<h2 style="font-size:20px">Entrar como organizador</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:16px"><button class="btn" onclick="login()">Entrar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
  const base=location.origin+location.pathname;
  openModal(`<h2 style="font-size:20px">Ajustes</h2>
    <label>Nombre del torneo</label><input id="cn" value="${esc(S.cfg.nombre)}">
    <label>Sistema de puntos de la tabla</label><select id="cm"><option value="voley" ${(S.cfg.modo||'voley')==='voley'?'selected':''}>Vóley: 3-0 / 2-0 y 3-1 suman 3 · 3-2 / 2-1 suman 2 y el perdedor 1</option><option value="simple" ${S.cfg.modo==='simple'?'selected':''}>Simple: puntos fijos por victoria y derrota</option></select>
    <label>Puntos por victoria (solo sistema simple)</label><input id="cv" type="number" inputmode="numeric" value="${S.cfg.pV}">
    <label>Puntos por derrota (solo sistema simple)</label><input id="cd" type="number" inputmode="numeric" value="${S.cfg.pD}">
    <label>Link para jugadores</label><input readonly value="${esc(base)}" onclick="this.select()">
    <label>Link para pantalla del buffet</label><input readonly value="${esc(base+'?modo=tv')}" onclick="this.select()">
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveCfg()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>
    <div class="row" style="margin-top:14px">${fs?'<button class="btn sm ghost" onclick="auth.signOut();closeModal()">Cerrar sesión</button>':''}<button class="btn sm red" onclick="borrarTodo()">Borrar todo el torneo</button></div>`);
}
function login(){auth.signInWithEmailAndPassword(val('em'),$('pw').value).then(closeModal).catch(()=>toast('Email o contraseña incorrectos'))}
function saveCfg(){S.cfg.nombre=val('cn')||DEF.cfg.nombre;S.cfg.modo=$('cm').value;S.cfg.pV=+$('cv').value||0;S.cfg.pD=+$('cd').value||0;closeModal();save()}
function borrarTodo(){if(confirm('¿Borrar equipos y partidos? No se puede deshacer.')){S=clone(DEF);closeModal();save()}}

/* ---------- equipos ---------- */
function editE(id){
  const e=S.equipos.find(x=>x.id===id)||{};
  const gs=[...new Set(S.equipos.map(x=>x.g).filter(Boolean))];
  openModal(`<h2 style="font-size:20px">${id?'Editar equipo':'Nuevo equipo'}</h2>
    <label>Nombre del equipo</label><input id="en" value="${esc(e.nombre)}">
    <label>Grupo (opcional, ej: Grupo A)</label><input id="eg" list="gl" value="${esc(e.g)}"><datalist id="gl">${gs.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <label>Capitán</label><input id="ec" value="${esc(e.cap)}">
    <label>Cantidad de jugadores</label><input id="ej" type="number" inputmode="numeric" value="${esc(e.jug)}">
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveE('${id||''}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn sm red" onclick="delE('${id}')">Eliminar</button>`:''}</div>`);
}
function saveE(id){
  const n=val('en');if(!n)return toast('Poné el nombre del equipo');
  let e=S.equipos.find(x=>x.id===id);if(!e){e={id:uid()};S.equipos.push(e)}
  Object.assign(e,{nombre:n,g:val('eg'),cap:val('ec'),jug:val('ej')});closeModal();save();
}
function delE(id){
  const n=S.partidos.filter(p=>p.a===id||p.b===id).length;
  if(!confirm(n?`Este equipo tiene ${n} partido(s) que también se van a borrar. ¿Eliminar?`:'¿Eliminar equipo?'))return;
  S.equipos=S.equipos.filter(e=>e.id!==id);S.partidos=S.partidos.filter(p=>p.a!==id&&p.b!==id);closeModal();save();
}

/* ---------- partidos ---------- */
const setsTxt=p=>p.sets.map(s=>s.a+'-'+s.b).join(', ');
const parseSets=t=>(t.match(/\d+\s*[-:]\s*\d+/g)||[]).map(x=>{const[a,b]=x.split(/[-:]/);return{a:+a,b:+b}});
function editM(id){
  if(S.equipos.length<2)return toast('Primero cargá al menos 2 equipos');
  const p=S.partidos.find(x=>x.id===id)||{estado:'pendiente',sets:[]};
  const opt=v=>S.equipos.map(e=>`<option value="${e.id}" ${e.id===v?'selected':''}>${esc(e.nombre)}</option>`).join('');
  openModal(`<h2 style="font-size:20px">${id?'Editar partido':'Nuevo partido'}</h2>
    <label>Equipo 1</label><select id="ma">${opt(p.a)}</select>
    <label>Equipo 2</label><select id="mb">${opt(p.b||(S.equipos[1]||{}).id)}</select>
    <label>Fase (opcional, ej: Semifinal)</label><input id="mf" value="${esc(p.fase)}">
    <label>Cancha (opcional)</label><input id="mc" value="${esc(p.cancha)}">
    <label>Sets cerrados (ej: 25-20, 22-25, 15-12)</label><input id="ms" value="${esc(setsTxt(p))}">
    <label>Estado</label><select id="me">${[['pendiente','Pendiente'],['vivo','En vivo'],['fin','Terminado']].map(([v,t])=>`<option value="${v}" ${p.estado===v?'selected':''}>${t}</option>`).join('')}</select>
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveM('${id||''}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn sm red" onclick="delM('${id}')">Eliminar</button>`:''}</div>`);
}
function saveM(id){
  if($('ma').value===$('mb').value)return toast('Elegí dos equipos distintos');
  let p=S.partidos.find(x=>x.id===id);if(!p){p={id:uid()};S.partidos.push(p)}
  Object.assign(p,{a:$('ma').value,b:$('mb').value,fase:val('mf'),cancha:val('mc'),sets:parseSets($('ms').value),estado:$('me').value});
  p.cur=p.estado==='vivo'?(p.cur||{a:0,b:0}):null;
  if(p.estado==='vivo'){if(!p.inicio)p.inicio=Date.now();p.dur=null}
  else if(p.estado==='fin'){if(p.inicio)p.dur=Date.now()-p.inicio;p.inicio=null}
  else{p.inicio=null;p.dur=null}
  closeModal();save();
}
function delM(id){if(confirm('¿Eliminar partido?')){S.partidos=S.partidos.filter(p=>p.id!==id);closeModal();save()}}
const gp=id=>S.partidos.find(p=>p.id===id);
function iniciar(id){const p=gp(id);p.estado='vivo';p.cur={a:0,b:0};p.inicio=Date.now();p.dur=null;save()}
function reiniciarReloj(id){if(confirm('¿Reiniciar el reloj de este partido a 00:00?')){gp(id).inicio=Date.now();save()}}
function pt(id,s,d){const p=gp(id);p.cur[s]=Math.max(0,p.cur[s]+d);save()}
function cerrarSet(id){const p=gp(id);if(p.cur.a+p.cur.b===0)return toast('El set está 0-0');p.sets.push({a:p.cur.a,b:p.cur.b});p.cur={a:0,b:0};save()}
function finalizar(id){const p=gp(id);if(p.cur&&p.cur.a+p.cur.b>0)p.sets.push({a:p.cur.a,b:p.cur.b});p.cur=null;p.estado='fin';p.dur=p.inicio?Date.now()-p.inicio:(p.dur||null);p.inicio=null;save()}
function reabrir(id){const p=gp(id);p.estado='vivo';p.cur=p.sets.pop()||{a:0,b:0};p.inicio=Date.now()-(p.dur||0);p.dur=null;save()}
function subir(id){const i=S.partidos.findIndex(p=>p.id===id);let j=i-1;while(j>=0&&S.partidos[j].estado!=='pendiente')j--;if(j<0)return toast('Ya es el primero de la cola');[S.partidos[i],S.partidos[j]]=[S.partidos[j],S.partidos[i]];save()}
function todosContraTodos(){
  const nuevos=[];
  [...new Set(S.equipos.map(e=>e.g||''))].forEach(g=>{
    const t=S.equipos.filter(e=>(e.g||'')===g);
    for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
      if(!S.partidos.some(p=>(p.a===t[i].id&&p.b===t[j].id)||(p.a===t[j].id&&p.b===t[i].id)))nuevos.push({id:uid(),a:t[i].id,b:t[j].id,fase:g,cancha:'',sets:[],estado:'pendiente',cur:null});
    }
  });
  if(!nuevos.length)return toast('No faltan cruces por crear');
  if(confirm(`Se van a crear ${nuevos.length} partidos pendientes (cada equipo contra los de su grupo). ¿Seguir?`)){S.partidos.push(...nuevos);save()}
}
init();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
